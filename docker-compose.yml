services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: gfn
      POSTGRES_PASSWORD: gfn_local_only
      POSTGRES_DB: gfn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "gfn_local_only"]
    ports:
      - "6379:6379"
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gfn_local
      MINIO_ROOT_PASSWORD: gfn_local_only_secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objects:/data
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [storage]
    entrypoint: >
      sh -c "until mc alias set local http://storage:9000 gfn_local gfn_local_only_secret; do sleep 1; done;
      mc mb --ignore-existing local/gfn-private && mc anonymous set none local/gfn-private"
volumes:
  pgdata:
  objects:
